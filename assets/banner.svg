<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="André Lemus — Software Developer, Founder of LogicAL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="280" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="14" fill="none" stroke="#1E293B"/>

  <!-- window dots -->
  <circle cx="40" cy="38" r="5" fill="#334155"/>
  <circle cx="58" cy="38" r="5" fill="#334155"/>
  <circle cx="76" cy="38" r="5" fill="#334155"/>

  <!-- prompt -->
  <text x="40" y="100" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="18" fill="#64748B">~/logical <tspan fill="#00D9FF">$</tspan> whoami</text>

  <!-- name -->
  <text x="40" y="170" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">André Lemus</text>
  <rect x="42" y="188" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- role -->
  <text x="40" y="232" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="20" fill="#94A3B8">Software Developer <tspan fill="#334155">/</tspan> Founder of <tspan fill="#00D9FF">LogicAL</tspan></text>

  <!-- right side tags -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#94A3B8">
    <rect x="900" y="86" width="260" height="34" rx="8" fill="#0B0F19" stroke="#1E293B"/>
    <text x="920" y="108">Desktop</text>
    <rect x="900" y="132" width="260" height="34" rx="8" fill="#0B0F19" stroke="#1E293B"/>
    <text x="920" y="154">Web</text>
    <rect x="900" y="178" width="260" height="34" rx="8" fill="#0B0F19" stroke="#1E293B"/>
    <text x="920" y="200">Mobile</text>
    <circle cx="1140" cy="103" r="4" fill="#00D9FF"/>
    <circle cx="1140" cy="149" r="4" fill="#00D9FF"/>
    <circle cx="1140" cy="195" r="4" fill="#00D9FF"/>
  </g>
</svg>
